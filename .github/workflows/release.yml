name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages & GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build & test
        run: |
          npm run build -w @ballast/core
          npm run build -w @ballast/cli
          npm run test -w @ballast/core
          npm run test -w @ballast/cli

      - name: Publish to npm (when NPM_TOKEN is configured)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          npm publish -w @ballast/core --access public --provenance
          npm publish -w @ballast/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/launch/github-release.md
